apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-replica
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey-replica
  template:
    metadata:
      labels:
        app: valkey-replica
    spec:
      containers:
      - name: valkey
        image: valkey/valkey:9.1
        command: ["valkey-server", "--replicaof", "valkey", "6379", "--replica-read-only", "yes"]
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command: ["valkey-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-replica
spec:
  selector:
    app: valkey-replica
  ports:
  - port: 6379
    targetPort: 6379
