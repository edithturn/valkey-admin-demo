apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-admin
  namespace: demo-cluster
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey-admin
  template:
    metadata:
      labels:
        app: valkey-admin
    spec:
      containers:
      - name: valkey-admin
        image: valkey/valkey-admin:latest
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "8080"
        - name: DEPLOYMENT_MODE
          value: "Web"
        - name: VALKEY_HOST
          value: valkey-demo.demo-cluster.svc.cluster.local
        - name: VALKEY_PORT
          value: "6379"
        - name: VALKEY_USERNAME
          value: valkey-admin
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-admin
  namespace: demo-cluster
spec:
  selector:
    app: valkey-admin
  ports:
  - name: http
    port: 8080
    targetPort: http
