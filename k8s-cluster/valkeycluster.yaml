apiVersion: v1
kind: Namespace
metadata:
  name: demo-cluster
---
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: demo
  namespace: demo-cluster
spec:
  shards: 3
  replicas: 1
  image: valkey/valkey:9.1
  workloadType: StatefulSet
  config:
    cluster-databases: "16"
    maxmemory-policy: allkeys-lfu
  users:
    - name: valkey-admin
      enabled: true
      nopass: true
      permissions: "+@all ~* &*"
